# ============================================================================
#  Dependabot
# ============================================================================
#  Two ecosystems, because pinning without updates is just old software with
#  extra steps. The action pins in the workflows are commit hashes, which
#  Dependabot understands and rewrites together with the `# vX.Y.Z` comment
#  beside them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies]

  #  Only the registry's requirements. config/requirements-webui.txt is a single
  #  unpinned `open-webui`, whose ~500 transitive packages this project does not
  #  choose - a PR per week there would be noise, and `llm update ui` is how
  #  that one moves.
  - package-ecosystem: pip
    directory: "/config"
    schedule:
      interval: weekly
    allow:
      - dependency-name: fastapi
      - dependency-name: uvicorn
      - dependency-name: mcp
    ignore:
      #  mcp 2.0 renamed mcp.server.fastmcp to mcp.server.mcpserver, and
      #  bin/llm-api.py imports FastMCP from the old path - so the registry does
      #  not start at all on 2.x. The bound in requirements-api.txt says so, and
      #  Dependabot proposed crossing it anyway (PR #5). Ignore the major until
      #  that import is migrated; patch and minor updates still come through.
      - dependency-name: mcp
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
    labels: [dependencies]
