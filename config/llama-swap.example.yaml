# ============================================================================
#  llama-swap configuration  —  ONE OpenAI-compatible endpoint for every model
# ============================================================================
#  Docs: docs/MODELS.md  |  every flag explained: docs/FLAGS.md
#
#  How it works:
#   - "macros" = the long llama-server commands live HERE, exactly once.
#   - "models" = each model is a short block that references a macro.
#   - You do NOT add models by hand; use:  llm add <repo> <quant>
#     (which appends a block at the end of this file).
#
#  THIS FILE IS THE TEMPLATE. 'llm init' fills in the two path placeholders and
#  writes config/llama-swap.yaml from it — that one belongs to the machine and is
#  therefore not in the repository. Do not name the placeholders in a comment:
#  the substitution is a plain sed over the whole file and would rewrite the
#  comment too, which is how generated configs used to end up with a path like
#  <llm-home><whisper-home> glued together in their header.
#
#  Endpoint afterwards:  http://<server-ip>:8080/v1   ('llm url' prints it)
# ============================================================================

healthCheckTimeout: 300          # seconds to wait for a model to come up
logLevel: info

macros:
  # --- plain server (the default for most models) ---------------------------
  server: >
    @LLM_HOME@/llama.cpp/build/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 99 -fa on --no-webui --jinja -cram 16384
    -ts 1,1

  # --- MTP / multi-token prediction -----------------------------------------
  #  Uses the MTP heads INSIDE the main model (only on MTP-capable models:
  #  Qwen3.x, DeepSeek V3/R1, Gemma 4 ...). Measured 1.4-2x faster.
  #  The GGUF has to contain the MTP tensors (see docs/FLAGS.md).
  server-mtp: >
    @LLM_HOME@/llama.cpp/build/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 99 -fa on --no-webui --jinja -cram 16384
    --spec-type draft-mtp
    -ts 1,1

  # --- n-gram speculation (universal, needs NO extra model) -----------------
  #  Strongest on code and repetitive text, and works with ANY model.
  #  When in doubt, this variant is always safe.
  server-ngram: >
    @LLM_HOME@/llama.cpp/build/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 99 -fa on --no-webui --jinja -cram 16384
    --spec-type ngram-simple --spec-draft-n-max 16
    -ts 1,1

  # --- embedding (text -> vector, for RAG / knowledge bases) ----------------
  #  NOT a chat model. Serves /v1/embeddings. Embedding models compute
  #  non-causally: -b/-ub must be >= the context or the server will not start.
  server-embed: >
    @LLM_HOME@/llama.cpp/build/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 99 -fa on --no-webui --embedding -b 4096 -ub 4096

  # --- reranking (sorts RAG hits by real relevance) -------------------------
  #  Serves /v1/rerank. Needs a reranker model - see docs/FLAGS.md, the GGUF
  #  has to carry cls.output.weight and a rerank chat template.
  server-rerank: >
    @LLM_HOME@/llama.cpp/build/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 99 -fa on --no-webui --embedding --pooling rank --reranking -b 4096 -ub 4096
# ============================================================================
#  ROLES (selectors)  —  virtual model names, maintained by 'llm role'
# ============================================================================
#  A client asks for a ROLE and llama-swap picks a real model for it, so
#  clients and their subagents never need to know a file name.
#   strategy: warm      -> the first target that is already running
#   strategy: pin       -> always the first target
#   strategy: spillover -> target 1 up to 'spillover' concurrent requests,
#                          then target 2 starts (= the second card)
#  A role reports the SMALLEST context and the INTERSECTION of the
#  capabilities of its targets.  DO NOT edit by hand:
# >>> llm:selectors
# <<< llm:selectors

# ============================================================================
#  GPU GROUPS  —  maintained automatically by 'llm add --gpu N' / 'llm gpu sync'
# ============================================================================
#  Every model pinned to a card lands in ONE group called 'pinned' - no matter
#  whether it was pinned with --device ROCmN or with env: HIP_VISIBLE_DEVICES=N
#  (that is how whisper does it, it has no --device flag).
#   swap: false      -> members do not evict each other
#   exclusive: false -> and do not evict anything from other groups
#   persistent: true -> and NO other group may evict them either
#  Only this lets two cards each hold a model at the same time, and it keeps a
#  model that spans all cards from throwing the service models out. One group
#  and not one per card, because a 'spillover' role needs all of its targets in
#  a single group.  DO NOT edit by hand:
# >>> llm:groups
# <<< llm:groups

# ============================================================================
#  MODELS  ('models' stays the LAST section — 'llm add' appends at the bottom)
# ============================================================================
models:

# --- From here on 'llm add' / 'llm rm' manage the entries automatically. ----
#
#  What one entry looks like (commented out = inactive). Everything except 'cmd'
#  is optional; 'llm add' writes this for you and it is easier to fix a flag with
#  'llm edit' or a PATCH than to write a block by hand:
#
#  # >>> llm:gemma-3-4b
#    "gemma-3-4b":
#      cmd: "${server} -m @LLM_HOME@/models/gemma-3-4b/gemma-3-4b-it-Q4_K_M.gguf -c 8192"
#      ttl: 900         # unload after 900 idle seconds (0 = never)
#  # <<< llm:gemma-3-4b
#
#  The marker comments are not decoration: only what sits between them is
#  visible to 'llm ls', the registry and pi. An entry added without them still
#  works in llama-swap and is invisible to everything else.
